name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Extract app version from Gradle
        id: version
        shell: bash
        run: |
          VERSION_OUTPUT=$(./gradlew -q :app:printVersionInfo)
          VERSION_CODE=$(printf '%s\n' "$VERSION_OUTPUT" | awk -F= '/^VERSION_CODE=/{print $2}')
          VERSION_NAME=$(printf '%s\n' "$VERSION_OUTPUT" | awk -F= '/^VERSION_NAME=/{print $2}')

          if [[ -z "$VERSION_CODE" || -z "$VERSION_NAME" ]]; then
            echo "Failed to read versionCode/versionName from Gradle output"
            echo "$VERSION_OUTPUT"
            exit 1
          fi

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" != "${{ steps.version.outputs.tag_name }}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version v${{ steps.version.outputs.version_name }}"
            exit 1
          fi

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Sign release APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Prepare release assets
        id: prep
        shell: bash
        run: |
          SIGNED_APK="${{ steps.sign_app.outputs.signedReleaseFile }}"
          APK_NAME="app-${{ steps.version.outputs.version_name }}-release.apk"
          cp "$SIGNED_APK" "$APK_NAME"

          SHA256=$(sha256sum "$APK_NAME" | cut -d ' ' -f 1)

          cat > latest.json <<EOF
          {
            "versionCode": ${{ steps.version.outputs.version_code }},
            "versionName": "${{ steps.version.outputs.version_name }}",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.version.outputs.tag_name }}/${APK_NAME}",
            "sha256": "${SHA256}",
            "changelog": "See GitHub release notes",
            "force": false,
            "minSupportedVersionCode": 1
          }
          EOF

          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            ${{ steps.prep.outputs.apk_name }}
            latest.json
