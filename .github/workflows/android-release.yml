name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools 29.0.3
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;29.0.3"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Extract app version from Gradle
        id: version
        shell: bash
        run: |
          VERSION_OUTPUT=$(./gradlew -q :app:printVersionInfo)
          VERSION_CODE=$(printf '%s\n' "$VERSION_OUTPUT" | awk -F= '/^VERSION_CODE=/{print $2}')
          VERSION_NAME=$(printf '%s\n' "$VERSION_OUTPUT" | awk -F= '/^VERSION_NAME=/{print $2}')
          FORCE_UPDATE=$(printf '%s\n' "$VERSION_OUTPUT" | awk -F= '/^FORCE_UPDATE=/{print $2}')
          MIN_SUPPORTED_VERSION_CODE=$(printf '%s\n' "$VERSION_OUTPUT" | awk -F= '/^MIN_SUPPORTED_VERSION_CODE=/{print $2}')

          if [[ -z "$VERSION_CODE" || -z "$VERSION_NAME" ]]; then
            echo "Failed to read versionCode/versionName from Gradle output"
            echo "$VERSION_OUTPUT"
            exit 1
          fi

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "force_update=$FORCE_UPDATE" >> "$GITHUB_OUTPUT"
          echo "min_supported_version_code=$MIN_SUPPORTED_VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" != "${{ steps.version.outputs.tag_name }}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version v${{ steps.version.outputs.version_name }}"
            exit 1
          fi

      - name: Validate versionCode increment
        shell: bash
        run: |
          CURRENT_VERSION_CODE='${{ steps.version.outputs.version_code }}'
          LATEST_JSON_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"

          PREV_VERSION_CODE=$(python3 - "$LATEST_JSON_URL" <<'PY'
          import json
          import urllib.request
          import urllib.error
          import sys

          url = sys.argv[1]
          try:
              with urllib.request.urlopen(url, timeout=10) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
                  print(int(data.get("versionCode", 0)))
          except urllib.error.HTTPError as e:
              if e.code == 404:
                  print(0)
              else:
                  raise
          except Exception:
              print(0)
          PY
          )

          PREV_VERSION_CODE=${PREV_VERSION_CODE:-0}

          if [[ "$PREV_VERSION_CODE" -gt 0 && "$CURRENT_VERSION_CODE" -le "$PREV_VERSION_CODE" ]]; then
            echo "Current versionCode ($CURRENT_VERSION_CODE) must be greater than previous release versionCode ($PREV_VERSION_CODE)."
            exit 1
          fi

          echo "versionCode check passed: current=$CURRENT_VERSION_CODE, previous=$PREV_VERSION_CODE"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Sign release APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Prepare release assets
        id: prep
        shell: bash
        run: |
          SIGNED_APK="${{ steps.sign_app.outputs.signedReleaseFile }}"
          APK_NAME="app-${{ steps.version.outputs.version_name }}-release.apk"
          cp "$SIGNED_APK" "$APK_NAME"

          SHA256=$(sha256sum "$APK_NAME" | cut -d ' ' -f 1)
          RELEASE_NOTES_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${{ steps.version.outputs.tag_name }}"

          # Get changelog since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 --exclude "${{ steps.version.outputs.tag_name }}" 2>/dev/null || echo "")
          if [[ -n "$LAST_TAG" ]]; then
            CHANGELOG=$(git log --no-merges "$LAST_TAG"..HEAD --pretty=format:'- %s' | grep -E '^- (feat|fix|perf)' | head -n 2)
          else
            CHANGELOG=$(git log --no-merges --pretty=format:'- %s' | grep -E '^- (feat|fix|perf)' | head -n 2)
          fi

          if [[ -z "$CHANGELOG" ]]; then
            CHANGELOG="See GitHub release notes"
          fi

          VERSION_CODE='${{ steps.version.outputs.version_code }}'
          VERSION_NAME='${{ steps.version.outputs.version_name }}'
          TAG_NAME='${{ steps.version.outputs.tag_name }}'
          FORCE_UPDATE='${{ steps.version.outputs.force_update }}'
          MIN_SUPPORTED_VERSION_CODE='${{ steps.version.outputs.min_supported_version_code }}'
          export VERSION_CODE VERSION_NAME TAG_NAME FORCE_UPDATE MIN_SUPPORTED_VERSION_CODE APK_NAME SHA256 CHANGELOG RELEASE_NOTES_URL GITHUB_REPOSITORY

          python3 - <<'PY'
          import json
          import os

          payload = {
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "apkUrl": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['TAG_NAME']}/{os.environ['APK_NAME']}",
              "sha256": os.environ["SHA256"],
              "changelog": os.environ["CHANGELOG"],
              "releaseNotesUrl": os.environ["RELEASE_NOTES_URL"],
              "force": os.environ.get("FORCE_UPDATE", "false").lower() == "true",
              "minSupportedVersionCode": int(os.environ.get("MIN_SUPPORTED_VERSION_CODE", "1")),
          }

          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
          PY

          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Validate latest metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path("latest.json")
          if not path.exists():
              raise SystemExit("latest.json not found")

          obj = json.loads(path.read_text(encoding="utf-8"))

          required_non_empty = ["versionName", "apkUrl", "sha256", "changelog"]
          for key in required_non_empty:
              value = obj.get(key)
              if not isinstance(value, str) or not value.strip():
                  raise SystemExit(f"Invalid or empty field: {key}")

          version_code = obj.get("versionCode")
          if not isinstance(version_code, int) or version_code <= 0:
              raise SystemExit("versionCode must be a positive integer")

          sha256 = obj["sha256"].strip().lower()
          if not re.fullmatch(r"[0-9a-f]{64}", sha256):
              raise SystemExit("sha256 must be a 64-char hex string")

          print("latest.json validation passed")
          PY

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            ${{ steps.prep.outputs.apk_name }}
            latest.json
